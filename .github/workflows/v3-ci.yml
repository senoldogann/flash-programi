name: V3 CI

on:
  push:
    branches:
      - rewrite/v3
    paths:
      - 'v3/**'
      - '.github/workflows/v3-ci.yml'
  pull_request:
    paths:
      - 'v3/**'
      - '.github/workflows/v3-ci.yml'

permissions:
  contents: read

jobs:
  verify-v3:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: Install dependencies
        run: npm install
      - name: Test
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
