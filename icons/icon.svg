<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <linearGradient id="flash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ff8c00"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Flash/Lightning Bolt -->
  <path d="M290 80 L180 240 L250 240 L220 432 L340 250 L270 250 Z" 
        fill="url(#flash)" 
        stroke="#fff" 
        stroke-width="8"
        stroke-linejoin="round"/>
  
  <!-- Sparkles -->
  <circle cx="120" cy="150" r="15" fill="#fff" opacity="0.8"/>
  <circle cx="400" cy="120" r="12" fill="#fff" opacity="0.7"/>
  <circle cx="380" cy="380" r="18" fill="#fff" opacity="0.6"/>
  <circle cx="100" cy="350" r="10" fill="#fff" opacity="0.8"/>
  
  <!-- Small stars -->
  <path d="M420 200 L425 215 L440 215 L428 225 L433 240 L420 230 L407 240 L412 225 L400 215 L415 215 Z" fill="#fff" opacity="0.9"/>
  <path d="M90 250 L93 260 L103 260 L95 267 L98 277 L90 270 L82 277 L85 267 L77 260 L87 260 Z" fill="#fff" opacity="0.8"/>
</svg>
